<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <style>
    text { font-family: 'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
    .title { fill:#f2f4f7; font-size:26px; font-weight:700; }
    .sub { fill:#8a8f98; font-size:14px; }
    .lbl { fill:#cfd3da; font-size:15px; font-weight:600; }
    .card { fill:#1c2027; }
    .screen { fill:#0f1116; }
    .sm { fill:#8a8f98; font-size:11px; }
    .big { fill:#e8eaed; font-size:20px; font-weight:700; }
    .accent { fill:#ff6b6b; }
    .blue { fill:#5b8cff; }
    .green { fill:#4ade80; }
  </style>

  <rect width="1000" height="600" fill="#0b0d12"/>

  <text class="title" x="40" y="46">Simple Fitness Dashboard</text>
  <text class="sub" x="40" y="72">本地优先 · 饮食 / 训练 / 身体记录 · LLM Agent 对话 · 数据存本机</text>

  <!-- ============ 左：网页端 ============ -->
  <text class="lbl" x="40" y="112">网页端 · 桌面（FastAPI + Vue）</text>
  <rect x="40" y="124" width="440" height="440" rx="14" fill="#14161c" stroke="#262b33"/>
  <circle cx="62" cy="146" r="5" fill="#ff5f57"/>
  <circle cx="80" cy="146" r="5" fill="#febc2e"/>
  <circle cx="98" cy="146" r="5" fill="#28c840"/>
  <rect x="40" y="124" width="86" height="440" fill="#0f1116"/>
  <rect x="52" y="166" width="62" height="22" rx="6" fill="#262b33"/>
  <text class="sm" x="60" y="181" fill="#cfd3da">总览</text>
  <rect x="52" y="198" width="62" height="22" rx="6" fill="#1c2027"/>
  <text class="sm" x="60" y="213" fill="#9aa0a8">记录</text>
  <rect x="52" y="230" width="62" height="22" rx="6" fill="#1c2027"/>
  <text class="sm" x="60" y="245" fill="#9aa0a8">分析</text>
  <rect x="52" y="262" width="62" height="22" rx="6" fill="#1c2027"/>
  <text class="sm" x="60" y="277" fill="#9aa0a8">设置</text>
  <rect x="52" y="520" width="62" height="22" rx="6" fill="#1c2027"/>
  <text class="sm" x="60" y="535" fill="#9aa0a8">助手</text>
  <rect class="card" x="142" y="150" width="318" height="58" rx="10"/>
  <text class="sm" x="158" y="174" fill="#cfd3da">今日概况</text>
  <text class="sm" x="158" y="194" fill="#8a8f98">训练 30min · 蛋白 120g · 缺口 840kcal</text>
  <circle cx="200" cy="262" r="42" fill="none" stroke="#2a2f38" stroke-width="12"/>
  <circle cx="200" cy="262" r="42" fill="none" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="171.6 263.9" transform="rotate(-90 200 262)"/>
  <text class="big" x="200" y="258" text-anchor="middle">1560</text>
  <text class="sm" x="200" y="278" text-anchor="middle" fill="#8a8f98">/ 2400 kcal</text>
  <text class="sm" x="270" y="250" fill="#cfd3da">摄入热量</text>
  <text class="sm" x="270" y="270" fill="#8a8f98">目标 2400 · 缺口 840</text>
  <text class="sm" x="142" y="334" fill="#cfd3da">蛋白</text>
  <rect x="142" y="340" width="318" height="12" rx="6" fill="#2a2f38"/>
  <rect x="142" y="340" width="190" height="12" rx="6" class="blue"/>
  <text class="sm" x="142" y="380" fill="#cfd3da">脂肪</text>
  <rect x="142" y="386" width="318" height="12" rx="6" fill="#2a2f38"/>
  <rect x="142" y="386" width="130" height="12" rx="6" class="accent"/>
  <text class="sm" x="142" y="426" fill="#cfd3da">碳水</text>
  <rect x="142" y="432" width="318" height="12" rx="6" fill="#2a2f38"/>
  <rect x="142" y="432" width="210" height="12" rx="6" class="green"/>

  <!-- ============ 右：手机端 ============ -->
  <text class="lbl" x="540" y="112">手机端 · Android（Capacitor APK）</text>
  <rect x="600" y="118" width="220" height="452" rx="30" fill="#14161c" stroke="#33383f"/>
  <rect class="screen" x="612" y="130" width="196" height="428" rx="18"/>
  <text class="sm" x="624" y="150" fill="#9aa0a8">9:41</text>
  <text class="lbl" x="624" y="184" font-size="18">总览</text>
  <rect class="card" x="624" y="198" width="172" height="50" rx="10"/>
  <text class="sm" x="638" y="220" fill="#cfd3da">今日热量</text>
  <text x="638" y="240" fill="#e8eaed" font-size="14" font-weight="700">1560 kcal</text>
  <rect class="card" x="624" y="258" width="172" height="50" rx="10"/>
  <text class="sm" x="638" y="280" fill="#cfd3da">训练</text>
  <text x="638" y="300" fill="#e8eaed" font-size="14" font-weight="700">有氧 30 min</text>
  <rect class="card" x="624" y="318" width="172" height="50" rx="10"/>
  <text class="sm" x="638" y="340" fill="#cfd3da">体重</text>
  <text x="638" y="360" fill="#e8eaed" font-size="14" font-weight="700">68.5 kg</text>
  <rect x="612" y="524" width="196" height="34" fill="#14161c"/>
  <g fill="#9aa0a8">
    <rect x="632" y="530" width="14" height="14" rx="3" fill="#5b8cff"/>
    <text class="sm" x="628" y="552" fill="#cfd3da">总览</text>
    <rect x="680" y="530" width="14" height="14" rx="3" fill="#33383f"/>
    <text class="sm" x="680" y="552">记录</text>
    <rect x="728" y="530" width="14" height="14" rx="3" fill="#33383f"/>
    <text class="sm" x="730" y="552">分析</text>
    <rect x="776" y="530" width="14" height="14" rx="3" fill="#33383f"/>
    <text class="sm" x="776" y="552">设置</text>
  </g>

  <text class="sub" x="40" y="592">网页端与手机端共享同一套记录模型，JSON 导出 / 导入互相同步 · 全部数据存本机</text>
</svg>
