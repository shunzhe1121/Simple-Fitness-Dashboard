<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报</title>
<link rel="stylesheet" href="/css/style.css?v=20261022d">
<style>
  .report-wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 96px; }
  .report-wrap > h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .report-wrap > h1::after {
    content: "";
    display: block;
    width: 34px;
    height: 2px;
    margin-top: 12px;
    background: var(--accent);
  }
  .report-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 24px 0 18px; }
  .report-list button {
    padding: 6px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text-3);
    font-family: var(--font-num);
    font-size: 12.5px;
    letter-spacing: .02em;
    cursor: pointer;
    transition: color .14s ease, border-color .14s ease, background .14s ease;
  }
  .report-list button:hover { border-color: var(--line-strong); color: var(--text); }
  .report-list button.active {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
    font-weight: 600;
  }
  .meta {
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--text-3);
  }
  .report-body {
    padding: 24px 26px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    font-size: 13.5px;
    line-height: 1.8;
  }
  .report-body h1 { font-size: 1.3em; }
  .report-body h2 { margin-top: 1.4em; font-size: 1.1em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .report-body ul { padding-left: 1.3em; }
</style>
</head>
<body>
<div class="report-wrap">
  <h1>AI 日报</h1>
  <div class="report-list" id="list"></div>
  <div class="meta" id="meta"></div>
  <div class="report-body" id="body">加载中…</div>
</div>
<script>
const $ = (id) => document.getElementById(id);

async function loadList() {
  const res = await fetch("/api/reports");
  const data = await res.json();
  const list = $("list");
  list.innerHTML = "";
  if (!data.reports.length) {
    list.innerHTML = "<span>还没有日报。可先在「AI 对话」里说「生成昨天的日报」，或 POST /api/reports/generate。</span>";
    $("body").textContent = "";
    return;
  }
  data.reports.forEach((r, i) => {
    const btn = document.createElement("button");
    btn.textContent = r.date;
    btn.onclick = () => loadReport(r.date, btn);
    list.appendChild(btn);
    if (i === 0) loadReport(r.date, btn);
  });
}

async function loadReport(date, btn) {
  document.querySelectorAll(".report-list button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  const res = await fetch(`/api/reports/${date}?html=true`);
  const data = await res.json();
  const r = data.report;
  $("meta").textContent = `${r.date} · ${r.model ? "模型：" + r.model : "本地模板（AI 未生成）"} · 更新于 ${r.created_at}`;
  $("body").innerHTML = r.html;
}

loadList();
</script>
</body>
</html>
